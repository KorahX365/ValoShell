name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: npm run build

      # The notes are written by hand in .github/release-notes/<tag>.md; the build's SHA-256 is
      # appended to them and published in SHA256SUMS.txt so downloads can be checked.
      - name: Name, hash and add the notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "ValoShell-$tag.exe"
          Copy-Item target/release/valoshell.exe $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # LF on purpose: `sha256sum -c` on Linux and Git Bash rejects a CRLF line.
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", "$hash  $exe`n")
          Copy-Item ".github/release-notes/$tag.md" release-notes.md
          Add-Content release-notes.md ""
          Add-Content release-notes.md ('**SHA-256** of `' + $exe + '`: `' + $hash + '`')

      # No generated notes: they list dependency bumps instead of what changed for players.
      # Tags with a "-" (v0.2.0-beta.1) publish as pre-releases; the rest become Latest.
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            ValoShell-${{ github.ref_name }}.exe
            SHA256SUMS.txt
